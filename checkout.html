<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - JA Electrónica</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-muted: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --header-height: 60px;
        }
        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-muted: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-light: #334155;
            --border-medium: #475569;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        .checkout-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--header-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 1000;
        }
        .checkout-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
        }
        .checkout-logo img { width: 36px; height: 36px; border-radius: 8px; }
        .checkout-logo-fallback {
            width: 36px; height: 36px; border-radius: 8px;
            background: var(--primary);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 0.875rem;
        }
        .checkout-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .checkout-back:hover { color: var(--primary); background: var(--bg-muted); }
        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: calc(var(--header-height) + 2rem) 1.5rem 3rem;
        }
        .checkout-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .checkout-title i { color: var(--primary); }
        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
            align-items: start;
        }
        .checkout-forms { display: flex; flex-direction: column; gap: 1.5rem; }
        .checkout-card {
            background: var(--bg-surface);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .checkout-card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-light);
        }
        .checkout-card-icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex; align-items: center; justify-content: center;
            color: white;
        }
        .checkout-card-title { font-size: 1rem; font-weight: 700; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-label { font-size: 0.8125rem; font-weight: 600; }
        .form-label .required { color: var(--error); margin-left: 2px; }
        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-light);
            border-radius: 10px;
            font-size: 0.9375rem;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-body);
            transition: all 0.2s;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-input::placeholder { color: var(--text-muted); }
        .delivery-options, .payment-options { display: flex; flex-direction: column; gap: 0.75rem; }
        .delivery-option {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1rem;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-body);
        }
        .delivery-option:hover { border-color: var(--primary-light); }
        .delivery-option.selected { border-color: var(--primary); background: rgba(37, 99, 235, 0.04); }
        .delivery-option input[type="radio"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); }
        .delivery-option-content { flex: 1; }
        .delivery-option-title { font-size: 0.9375rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .delivery-option-title i { color: var(--primary); }
        .delivery-option-desc { font-size: 0.8125rem; color: var(--text-secondary); margin-top: 0.25rem; }
        .delivery-price { font-size: 0.875rem; font-weight: 700; color: var(--success); }
        .delivery-address-fields { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-light); display: none; }
        .delivery-address-fields.show { display: block; }
        .payment-option {
            border: 2px solid var(--border-light);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
            background: var(--bg-body);
        }
        .payment-option:hover { border-color: var(--primary-light); }
        .payment-option.selected { border-color: var(--primary); background: rgba(37, 99, 235, 0.04); }
        .payment-option-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            cursor: pointer;
        }
        .payment-option-header input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); }
        .payment-option-header i { font-size: 1.25rem; color: var(--primary); width: 28px; text-align: center; }
        .payment-option-title { font-size: 0.9375rem; font-weight: 600; }
        .payment-details { padding: 0 1rem 1rem; display: none; }
        .payment-option.selected .payment-details { display: block; }
        .bank-info {
            background: rgba(37, 99, 235, 0.06);
            border-left: 3px solid var(--primary);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .bank-info p { font-size: 0.8125rem; margin: 0.25rem 0; line-height: 1.5; }
        .bank-info strong { color: var(--primary); }
        .file-upload { position: relative; }
        .file-upload input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 1; }
        .file-upload-label {
            display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
            padding: 1.25rem; border: 2px dashed var(--border-medium); border-radius: 10px;
            background: var(--bg-body); cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .file-upload-label:hover { border-color: var(--primary); }
        .file-upload-label i { font-size: 1.5rem; color: var(--text-muted); }
        .file-upload-label span { font-size: 0.875rem; color: var(--text-secondary); }
        .file-preview { margin-top: 1rem; text-align: center; display: none; }
        .file-preview.show { display: block; }
        .file-preview img { max-width: 100%; max-height: 150px; border-radius: 8px; border: 1px solid var(--border-light); }
        .file-preview-remove { margin-top: 0.5rem; padding: 0.5rem 1rem; background: var(--error); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8125rem; font-weight: 600; }
        .invoice-toggle { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
        .invoice-toggle input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
        .invoice-toggle span { font-size: 0.9375rem; font-weight: 600; }
        .invoice-fields { margin-top: 1rem; display: none; }
        .invoice-fields.show { display: block; }
        .order-summary { position: sticky; top: calc(var(--header-height) + 2rem); }
        .order-items { max-height: 300px; overflow-y: auto; margin-bottom: 1rem; }
        .order-items::-webkit-scrollbar { width: 4px; }
        .order-items::-webkit-scrollbar-track { background: var(--bg-muted); border-radius: 4px; }
        .order-items::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }
        .order-item { display: flex; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border-light); }
        .order-item:last-child { border-bottom: none; }
        .order-item-image { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; background: var(--bg-muted); flex-shrink: 0; }
        .order-item-image img { width: 100%; height: 100%; object-fit: cover; }
        .order-item-info { flex: 1; min-width: 0; }
        .order-item-brand { font-size: 0.6875rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
        .order-item-title { font-size: 0.875rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .order-item-qty { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
        .order-item-price { font-size: 0.9375rem; font-weight: 700; white-space: nowrap; }
        .order-totals { border-top: 2px solid var(--border-light); padding-top: 1rem; }
        .order-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; }
        .order-row-label { font-size: 0.9375rem; color: var(--text-secondary); }
        .order-row-value { font-size: 0.9375rem; font-weight: 600; }
        .order-row.total { border-top: 2px solid var(--border-light); margin-top: 0.5rem; padding-top: 1rem; }
        .order-row.total .order-row-label { font-size: 1.125rem; font-weight: 700; color: var(--text-primary); }
        .order-row.total .order-row-value { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
        .summary-note { margin-top: 1rem; padding: 0.875rem; background: rgba(37, 99, 235, 0.06); border-radius: 10px; display: flex; gap: 0.75rem; align-items: flex-start; }
        .summary-note i { color: var(--primary); margin-top: 2px; }
        .summary-note p { font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5; }
        .checkout-submit {
            width: 100%; padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: all 0.3s; margin-top: 1.25rem; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }
        .checkout-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
        .checkout-submit i { font-size: 1.25rem; }
        .empty-cart { text-align: center; padding: 4rem 2rem; grid-column: 1 / -1; }
        .empty-cart-icon { width: 100px; height: 100px; border-radius: 50%; background: var(--bg-muted); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
        .empty-cart-icon i { font-size: 2.5rem; color: var(--text-muted); }
        .empty-cart h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
        .empty-cart p { color: var(--text-secondary); margin-bottom: 2rem; }
        .empty-cart-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 1rem 2rem; background: var(--primary); color: white; text-decoration: none; border-radius: 10px; font-weight: 600; transition: all 0.2s; }
        .empty-cart-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); display: flex; align-items: center; gap: 12px; padding: 1rem 1.5rem; background: var(--bg-surface); border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15); z-index: 9999; font-size: 0.9375rem; font-weight: 500; opacity: 0; transition: all 0.3s; border: 1px solid var(--border-light); }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { border-left: 4px solid var(--error); }
        .toast.error i { color: var(--error); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.success i { color: var(--success); }
        @media (max-width: 900px) {
            .checkout-grid { grid-template-columns: 1fr; }
            .order-summary { position: static; order: -1; }
            .order-items { max-height: 200px; }
        }
        @media (max-width: 640px) {
            .checkout-container { padding: calc(var(--header-height) + 1rem) 1rem 2rem; }
            .checkout-title { font-size: 1.25rem; }
            .checkout-card { padding: 1rem; border-radius: 12px; }
            .form-grid { grid-template-columns: 1fr; }
            .checkout-back span { display: none; }
            .order-item-image { width: 56px; height: 56px; }
        }
        @media (max-width: 480px) {
            .checkout-header { padding: 0 1rem; }
            .checkout-logo span { display: none; }
        }
    </style>
</head>
<body>
    <header class="checkout-header">
        <a href="index.html" class="checkout-logo">
            <img src="logo.png" alt="JA" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="checkout-logo-fallback" style="display: none;">JA</div>
            <span>Electrónica</span>
        </a>
        <a href="index.html" class="checkout-back">
            <i class="fas fa-arrow-left"></i>
            <span>Volver a la tienda</span>
        </a>
    </header>
    <div class="checkout-container">
        <h1 class="checkout-title"><i class="fas fa-shopping-bag"></i> Finalizar Compra</h1>
        <div class="checkout-grid" id="checkoutContent"></div>
    </div>
    <script>
    (function() {
        'use strict';
        const $ = (s, c = document) => c.querySelector(s);
        const $$ = (s, c = document) => [...c.querySelectorAll(s)];
        const formatPrice = n => new Intl.NumberFormat('es-PY').format(n);
        
        function toast(msg, type = 'success') {
            const old = $('.toast');
            if (old) old.remove();
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : 'exclamation-circle') + '"></i><span>' + msg + '</span>';
            document.body.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3500);
        }
        
        function getCart() {
            const keys = ['cart', 'ja_cart', 'ja_guest_cart'];
            for (const k of keys) {
                try {
                    const d = localStorage.getItem(k);
                    if (d) {
                        const p = JSON.parse(d);
                        if (Array.isArray(p) && p.length > 0) {
                            console.log('Carrito en:', k);
                            return { items: p, key: k };
                        }
                    }
                } catch (e) {}
            }
            return { items: [], key: 'cart' };
        }
        
        function syncTheme() {
            const keys = ['theme', 'ja_theme'];
            for (const k of keys) {
                const v = localStorage.getItem(k);
                if (v) { document.documentElement.setAttribute('data-theme', v); return; }
            }
        }
        
        function render() {
            const { items: cart, key: cartKey } = getCart();
            const container = $('#checkoutContent');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart"><div class="empty-cart-icon"><i class="fas fa-shopping-cart"></i></div><h2>Tu carrito está vacío</h2><p>Agrega productos para continuar</p><a href="index.html" class="empty-cart-btn"><i class="fas fa-arrow-left"></i> Volver a la tienda</a></div>';
                return;
            }
            
            const subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            const itemsHTML = cart.map(i => '<div class="order-item"><div class="order-item-image"><img src="' + i.image + '" alt="' + i.title + '" onerror="this.src=\'https://via.placeholder.com/64\'"></div><div class="order-item-info"><div class="order-item-brand">' + (i.brand || '') + '</div><div class="order-item-title">' + i.title + '</div><div class="order-item-qty">Cantidad: ' + i.quantity + '</div></div><div class="order-item-price">₲ ' + formatPrice(i.price * i.quantity) + '</div></div>').join('');
            
            container.innerHTML = '<div class="checkout-forms"><div class="checkout-card"><div class="checkout-card-header"><div class="checkout-card-icon"><i class="fas fa-truck"></i></div><h2 class="checkout-card-title">Método de Entrega</h2></div><div class="delivery-options"><label class="delivery-option selected" data-value="store"><input type="radio" name="delivery" value="store" checked><div class="delivery-option-content"><div class="delivery-option-title"><i class="fas fa-store"></i> Retiro en Tienda</div><div class="delivery-option-desc">Retira tu pedido en nuestro local</div></div><div class="delivery-price">Gratis</div></label><label class="delivery-option" data-value="delivery"><input type="radio" name="delivery" value="delivery"><div class="delivery-option-content"><div class="delivery-option-title"><i class="fas fa-motorcycle"></i> Envío a Domicilio</div><div class="delivery-option-desc">Te lo llevamos a tu dirección</div></div><div class="delivery-price">A calcular</div></label></div><div class="delivery-address-fields" id="addressFields"><div class="form-grid"><div class="form-group full-width"><label class="form-label">Dirección <span class="required">*</span></label><input type="text" class="form-input" id="address" placeholder="Calle, número"></div><div class="form-group"><label class="form-label">Ciudad <span class="required">*</span></label><input type="text" class="form-input" id="city" placeholder="Ciudad"></div><div class="form-group"><label class="form-label">Departamento <span class="required">*</span></label><select class="form-select" id="department"><option value="">Seleccionar</option><option value="Asunción">Asunción</option><option value="Central">Central</option><option value="Alto Paraná">Alto Paraná</option><option value="Itapúa">Itapúa</option><option value="Otro">Otro</option></select></div></div></div></div><div class="checkout-card"><div class="checkout-card-header"><div class="checkout-card-icon"><i class="fas fa-user"></i></div><h2 class="checkout-card-title">Datos de Contacto</h2></div><div class="form-grid"><div class="form-group full-width"><label class="form-label">Nombre Completo <span class="required">*</span></label><input type="text" class="form-input" id="fullName" placeholder="Tu nombre completo"></div><div class="form-group"><label class="form-label">Teléfono <span class="required">*</span></label><input type="tel" class="form-input" id="phone" placeholder="0991 234 567"></div><div class="form-group"><label class="form-label">Email <span class="required">*</span></label><input type="email" class="form-input" id="email" placeholder="tu@email.com"></div></div></div><div class="checkout-card"><div class="checkout-card-header"><div class="checkout-card-icon"><i class="fas fa-credit-card"></i></div><h2 class="checkout-card-title">Método de Pago</h2></div><div class="payment-options"><div class="payment-option" data-value="cash"><label class="payment-option-header"><input type="radio" name="payment" value="cash"><i class="fas fa-money-bill-wave"></i><span class="payment-option-title">Efectivo</span></label><div class="payment-details"><div class="form-group"><label class="form-label">¿Con cuánto pagará?</label><input type="text" class="form-input" id="cashAmount" placeholder="Ej: 500.000"><small style="display:block;margin-top:0.5rem;color:var(--text-muted);font-size:0.75rem;">Prepararemos el vuelto</small></div></div></div><div class="payment-option" data-value="transfer"><label class="payment-option-header"><input type="radio" name="payment" value="transfer"><i class="fas fa-university"></i><span class="payment-option-title">Transferencia Bancaria</span></label><div class="payment-details"><div class="bank-info"><p><strong>Datos para transferencia:</strong></p><p>Banco: Banco Continental</p><p>Cuenta: 1234567890</p><p>Titular: JA Electrónica</p><p>CI/RUC: 1234567-8</p></div><div class="form-group"><label class="form-label">Comprobante <span class="required">*</span></label><div class="file-upload"><input type="file" id="receiptFile" accept="image/*,.pdf"><div class="file-upload-label"><i class="fas fa-cloud-upload-alt"></i><span id="fileLabel">Subir comprobante</span></div></div><div class="file-preview" id="filePreview"><img id="previewImg" src="" alt="Vista previa"><button type="button" class="file-preview-remove" id="removeFile"><i class="fas fa-times"></i> Eliminar</button></div></div></div></div></div></div><div class="checkout-card"><div class="checkout-card-header"><div class="checkout-card-icon"><i class="fas fa-file-invoice"></i></div><h2 class="checkout-card-title">Facturación</h2></div><label class="invoice-toggle"><input type="checkbox" id="needInvoice"><span>Necesito factura con RUC</span></label><div class="invoice-fields" id="invoiceFields"><div class="form-grid" style="margin-top:1rem;"><div class="form-group"><label class="form-label">RUC <span class="required">*</span></label><input type="text" class="form-input" id="invoiceRuc" placeholder="Ej: 57736607"></div><div class="form-group"><label class="form-label">Razón Social <span class="required">*</span></label><input type="text" class="form-input" id="invoiceName" placeholder="Nombre o empresa"></div></div></div></div></div><div class="order-summary"><div class="checkout-card"><div class="checkout-card-header"><div class="checkout-card-icon"><i class="fas fa-receipt"></i></div><h2 class="checkout-card-title">Resumen del Pedido</h2></div><div class="order-items">' + itemsHTML + '</div><div class="order-totals"><div class="order-row"><span class="order-row-label">Subtotal</span><span class="order-row-value">₲ ' + formatPrice(subtotal) + '</span></div><div class="order-row"><span class="order-row-label">Envío</span><span class="order-row-value" id="shippingDisplay">Gratis</span></div><div class="order-row total"><span class="order-row-label">Total</span><span class="order-row-value" id="totalDisplay">₲ ' + formatPrice(subtotal) + '</span></div></div><div class="summary-note"><i class="fas fa-info-circle"></i><p>El costo de envío se confirmará por WhatsApp según tu ubicación.</p></div><button class="checkout-submit" id="submitOrder"><i class="fab fa-whatsapp"></i> Confirmar Pedido</button></div></div>';
            
            setupEvents(cart, cartKey);
        }
        
        function setupEvents(cart, cartKey) {
            $$('.delivery-option').forEach(opt => {
                const radio = $('input[type="radio"]', opt);
                radio.addEventListener('change', () => {
                    $$('.delivery-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    const af = $('#addressFields');
                    const sd = $('#shippingDisplay');
                    if (radio.value === 'delivery') { af.classList.add('show'); sd.textContent = 'A calcular'; }
                    else { af.classList.remove('show'); sd.textContent = 'Gratis'; }
                });
            });
            
            $$('.payment-option').forEach(opt => {
                const radio = $('input[type="radio"]', opt);
                radio.addEventListener('change', () => {
                    $$('.payment-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                });
            });
            
            const fi = $('#receiptFile'), fl = $('#fileLabel'), fp = $('#filePreview'), pi = $('#previewImg'), rf = $('#removeFile');
            if (fi) fi.addEventListener('change', e => {
                if (e.target.files.length > 0) {
                    const f = e.target.files[0];
                    fl.textContent = f.name;
                    if (f.type.startsWith('image/')) {
                        const r = new FileReader();
                        r.onload = ev => { pi.src = ev.target.result; fp.classList.add('show'); };
                        r.readAsDataURL(f);
                    } else fp.classList.remove('show');
                }
            });
            if (rf) rf.addEventListener('click', e => { e.preventDefault(); fi.value = ''; fl.textContent = 'Subir comprobante'; fp.classList.remove('show'); pi.src = ''; });
            
            const ca = $('#cashAmount');
            if (ca) ca.addEventListener('input', e => { let v = e.target.value.replace(/\D/g, ''); if (v) e.target.value = formatPrice(parseInt(v)); });
            
            const ni = $('#needInvoice'), invf = $('#invoiceFields');
            if (ni && invf) ni.addEventListener('change', e => invf.classList.toggle('show', e.target.checked));
            
            const sb = $('#submitOrder');
            if (sb) sb.addEventListener('click', () => processOrder(cart, cartKey));
        }
        
        function processOrder(cart, cartKey) {
            const delivery = $('input[name="delivery"]:checked')?.value;
            const payment = $('input[name="payment"]:checked')?.value;
            const fn = $('#fullName')?.value.trim();
            const ph = $('#phone')?.value.trim();
            const em = $('#email')?.value.trim();
            
            if (!fn || !ph || !em) { toast('Completa los datos de contacto', 'error'); return; }
            if (!payment) { toast('Selecciona un método de pago', 'error'); return; }
            
            if (delivery === 'delivery') {
                const addr = $('#address')?.value.trim();
                const city = $('#city')?.value.trim();
                const dept = $('#department')?.value;
                if (!addr || !city || !dept) { toast('Completa la dirección de envío', 'error'); return; }
            }
            
            if (payment === 'transfer' && !$('#receiptFile')?.files[0]) { toast('Sube el comprobante de transferencia', 'error'); return; }
            
            const total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            const items = cart.map(i => '• ' + i.quantity + 'x ' + (i.brand ? i.brand + ' ' : '') + i.title + ' - ₲' + formatPrice(i.price * i.quantity)).join('\n');
            
            let msg = '🛒 *NUEVO PEDIDO - JA Electrónica*\n\n📦 *Productos:*\n' + items + '\n\n💰 *Total:* ₲' + formatPrice(total) + '\n\n👤 *Cliente:* ' + fn + '\n📱 *Teléfono:* ' + ph + '\n📧 *Email:* ' + em + '\n\n';
            
            if (delivery === 'delivery') {
                msg += '🚚 *Envío a:* ' + $('#address').value + ', ' + $('#city').value + ', ' + $('#department').value + '\n\n';
            } else {
                msg += '🏪 *Retiro en tienda*\n\n';
            }
            
            msg += '💳 *Pago:* ' + (payment === 'cash' ? 'Efectivo' : 'Transferencia') + '\n';
            
            const ca = $('#cashAmount')?.value;
            if (payment === 'cash' && ca) msg += '💵 *Paga con:* ₲' + ca + '\n';
            
            if ($('#needInvoice')?.checked) {
                const ruc = $('#invoiceRuc')?.value.trim();
                const rs = $('#invoiceName')?.value.trim();
                if (ruc && rs) msg += '\n📄 *Factura:* RUC ' + ruc + ' - ' + rs + '\n';
            }
            
            window.open('https://wa.me/595992544305?text=' + encodeURIComponent(msg), '_blank');
            toast('¡Pedido enviado! Te contactaremos pronto.', 'success');
            localStorage.removeItem(cartKey);
            setTimeout(() => { window.location.href = 'index.html'; }, 2500);
        }
        
        syncTheme();
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
        else render();
    })();
    </script>
</body>
</html>
